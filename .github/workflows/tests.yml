name: tests

on:
  push:
    branches:
      - main
      - phase-1-fraud-detection-foundation
      - phase-3-fraud-intelligence-platform
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scikit-learn==1.5.1 \
            fastapi==0.115.6 \
            httpx==0.28.1 \
            pytest==8.3.4

      - name: Run unit tests
        run: pytest
